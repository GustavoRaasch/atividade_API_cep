<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Consulta CEP</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="box">

<h1>ViaCEP</h1>

<p>Consulte um CEP</p>

<input id="cep" placeholder="Digite o CEP">

<button onclick="buscar()">Buscar</button>

<div id="resultado"></div>

</div>

<script>
async function buscar(){

  let cep=document.getElementById("cep").value
    .replace(/\D/g,"");

  if(cep.length!=8){
    resultado.innerHTML="Digite um CEP válido!";
    return;
  }

  let r=await fetch(
    "https://viacep.com.br/ws/"+cep+"/json/"
  );

  let d=await r.json();

  if(d.erro){
    resultado.innerHTML="CEP não encontrado!";
    return;
  }

  resultado.innerHTML=`
    <b>CEP:</b> ${d.cep}<br>
    <b>Rua:</b> ${d.logradouro}<br>
    <b>Bairro:</b> ${d.bairro}<br>
    <b>Cidade:</b> ${d.localidade}<br>
    <b>Estado:</b> ${d.uf}
  `;
}
</script>

</body>
</html>
